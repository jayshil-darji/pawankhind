name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::812982728849:role/pawankhind-github-ci
          aws-region: ap-southeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/pawankhind/registration:${{ github.sha }}"
          docker build -f services/registration/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: push-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTANCE_ID: i-0bd73ab3f5d6ecc49
      IMAGE: 812982728849.dkr.ecr.ap-southeast-2.amazonaws.com/pawankhind/registration:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::812982728849:role/pawankhind-github-ci
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/compose.dev.yaml)
          jq -n --arg img "$IMAGE" --arg compose "$COMPOSE_B64" --rawfile script deploy/remote-deploy.sh \
            '{commands: [("export IMAGE=" + ($img|@sh) + "; export COMPOSE_B64=" + ($compose|@sh) + "\n" + $script)]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --comment "deploy ${GITHUB_SHA}" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output json > result.json

          jq -r '.StandardOutputContent, .StandardErrorContent' result.json
          test "$(jq -r .Status result.json)" = "Success"
