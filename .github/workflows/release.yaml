name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::812982728849:role/pawankhind-github-ci
          aws-region: ap-southeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/pawankhind/registration:${{ github.sha }}"
          docker build -f services/registration/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: push-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTANCE_ID: i-0bd73ab3f5d6ecc49
      IMAGE: 812982728849.dkr.ecr.ap-southeast-2.amazonaws.com/pawankhind/registration:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::812982728849:role/pawankhind-github-ci
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/compose.dev.yaml)
          jq -n --arg img "$IMAGE" --arg compose "$COMPOSE_B64" --rawfile script deploy/remote-deploy.sh \
            '{commands: [("export IMAGE=" + ($img|@sh) + "; export COMPOSE_B64=" + ($compose|@sh) + "\n" + $script)]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --comment "deploy ${GITHUB_SHA}" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output json > result.json

          jq -r '.StandardOutputContent, .StandardErrorContent' result.json
          test "$(jq -r .Status result.json)" = "Success"

  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_BUCKET: pawankhind-dev-web-812982728849
      WEB_DISTRIBUTION_ID: E39XSXT7QM29DY
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm turbo build --filter=@pawankhind/web...
        env:
          # For the gated dev site only: lets ?phase=before|open|after show each
          # registration state. REMOVE BEFORE GO-LIVE (see CLAUDE.md "Before go-live").
          VITE_ALLOW_PHASE_OVERRIDE: "true"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::812982728849:role/pawankhind-github-ci
          aws-region: ap-southeast-2

      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (never cached)
        run: |
          aws s3 cp apps/web/dist/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control "no-cache" --content-type text/html

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths "/*"
